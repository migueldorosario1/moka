<svg xmlns="http://www.w3.org/2000/svg" width="360" height="540" viewBox="0 0 360 540">
  <!-- Azul-frança profundo com ouro -->
  <rect width="360" height="540" fill="#1e3a5f"/>
  <rect x="10" y="10" width="340" height="520" fill="none" stroke="#d8b45a" stroke-width="1.6"/>
  <rect x="18" y="18" width="324" height="504" fill="none" stroke="#d8b45a" stroke-width="0.7" opacity="0.65"/>

  <!-- Sol de Eldorado -->
  <g>
    <circle cx="180" cy="160" r="46" fill="#e8c45a"/>
    <g stroke="#e8c45a" stroke-width="3">
      <line x1="180" y1="92" x2="180" y2="70"/>
      <line x1="180" y1="228" x2="180" y2="250"/>
      <line x1="112" y1="160" x2="90" y2="160"/>
      <line x1="248" y1="160" x2="270" y2="160"/>
      <line x1="132" y1="112" x2="116" y2="96"/>
      <line x1="228" y1="112" x2="244" y2="96"/>
      <line x1="132" y1="208" x2="116" y2="224"/>
      <line x1="228" y1="208" x2="244" y2="224"/>
    </g>
    <circle cx="180" cy="160" r="30" fill="none" stroke="#1e3a5f" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- Montanhas do "melhor dos mundos" -->
  <polygon points="60,250 130,190 200,250" fill="#2c4d7a"/>
  <polygon points="160,250 235,185 310,250" fill="#27456e"/>
  <line x1="0" y1="252" x2="360" y2="252" stroke="#d8b45a" stroke-width="1.4"/>

  <text x="180" y="330" font-family="Georgia, serif" font-size="38" font-weight="bold" text-anchor="middle" fill="#f2e6c4">CANDIDE</text>
  <text x="180" y="364" font-family="Georgia, serif" font-size="19" font-style="italic" text-anchor="middle" fill="#e8cf8e">ou l'optimisme</text>
  <line x1="120" y1="392" x2="240" y2="392" stroke="#d8b45a" stroke-width="1"/>
  <text x="180" y="426" font-family="Georgia, serif" font-size="20" font-style="italic" text-anchor="middle" fill="#f2e6c4">Voltaire</text>

  <text x="180" y="506" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#e8cf8e" letter-spacing="3">BIBLIOTECA LIVRE · MOKA</text>
</svg>
