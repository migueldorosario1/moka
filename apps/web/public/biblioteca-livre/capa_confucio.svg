  <line x1="120" y1="390" x2="240" y2="390" stroke="#d8b45a" stroke-width="1"/>
  <text x="180" y="424" font-family="Georgia, serif" font-size="19" font-style="italic" text-anchor="middle" fill="#f5e8c8">Confúcio</text>

  <text x="180" y="506" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#e8cf8e" letter-spacing="3">BIBLIOTECA LIVRE · MOKA</text>
