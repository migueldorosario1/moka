<svg xmlns="http://www.w3.org/2000/svg" width="360" height="540" viewBox="0 0 360 540">
  <!-- Fundo vermelho-laca clássico -->
  <rect width="360" height="540" fill="#7d1d1d"/>
  <rect x="10" y="10" width="340" height="520" fill="none" stroke="#d8b45a" stroke-width="1.6"/>
  <rect x="18" y="18" width="324" height="504" fill="none" stroke="#d8b45a" stroke-width="0.7" opacity="0.65"/>

  <!-- Selo redondo com o ideograma -->
  <circle cx="180" cy="170" r="86" fill="#f5e8c8"/>
  <circle cx="180" cy="170" r="78" fill="none" stroke="#7d1d1d" stroke-width="2"/>
  <text x="180" y="200" font-family="Georgia, 'Noto Serif SC', serif" font-size="92" font-weight="bold" text-anchor="middle" fill="#7d1d1d">論</text>

  <!-- Bambus laterais discretos -->
  <g stroke="#d8b45a" stroke-width="2" opacity="0.55" fill="none">
